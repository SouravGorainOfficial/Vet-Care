<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="pawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ccfbf1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#042f2e" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Ring Accent -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.18" />

  <!-- Medical Cross Glow / Base -->
  <g filter="url(#shadow)">
    <!-- White Medical Cross -->
    <path d="M216 112 h80 v104 h104 v80 h-104 v104 h-80 v-104 h-104 v-80 h104 z" fill="#ffffff" rx="16" />
  </g>

  <!-- Center Pet Paw Symbol embedded in Cross -->
  <g fill="#0d9488">
    <!-- Main Paw Pad -->
    <path d="M256 244 c-24 0 -42 16 -38 36 c3 16 18 24 38 24 s35 -8 38 -24 c4 -20 -14 -36 -38 -36 z" />
    <!-- Toe 1 -->
    <ellipse cx="224" cy="226" rx="9" ry="14" transform="rotate(-18 224 226)" />
    <!-- Toe 2 -->
    <ellipse cx="245" cy="214" rx="9" ry="14" transform="rotate(-6 245 214)" />
    <!-- Toe 3 -->
    <ellipse cx="267" cy="214" rx="9" ry="14" transform="rotate(6 267 214)" />
    <!-- Toe 4 -->
    <ellipse cx="288" cy="226" rx="9" ry="14" transform="rotate(18 288 226)" />
  </g>

  <!-- Heart pulse accent at bottom -->
  <path d="M228 356 l18 -18 c6 -6 16 -6 22 0 l-11 11 l-11 -11 z" fill="#0d9488" opacity="0.6" />
</svg>
